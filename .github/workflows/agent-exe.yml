name: Sync agent exe

# Builds the Windows program people double-click (desktop-sync-agent/dist/SnehDistribuorsSync.exe) and its setup file.
# - Every merge to master that changes the agent: tests, build, and a new GitHub Release (agent-v2.0.<run number>)
#   with both files attached. People download it from the repository's Releases page.
# - Pushing a tag like agent-v2.1.0: a release with that exact version.
# - Pull requests and manual runs: build and test only; download from the run's Artifacts.
on:
  workflow_dispatch:
    inputs:
      builder:
        description: "Also build with Nuitka, for comparison only (the release always uses the PyInstaller exe)"
        type: choice
        options: [pyinstaller, nuitka]
        default: pyinstaller
  push:
    branches: [master]
    tags: ["agent-v*"]
    paths:
      - "desktop-sync-agent/**"
      - ".github/workflows/agent-exe.yml"
  pull_request:
    paths:
      - "desktop-sync-agent/**"
      - ".github/workflows/agent-exe.yml"

permissions:
  contents: read

concurrency:
  group: agent-exe-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build SnehDistribuorsSync.exe
    runs-on: windows-latest
    permissions:
      contents: write   # to attach the .exe to a release when a tag is pushed
    defaults:
      run:
        shell: pwsh
        working-directory: desktop-sync-agent
    env:
      # Set under Settings > Secrets and variables > Actions to sign the exe. Without them the build is unsigned.
      CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"   # the version installer/build_windows_exe.bat builds with
          architecture: x64
      - name: Work out the version and the release tag
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/agent-v*') {
            $version = $env:GITHUB_REF_NAME -replace '^agent-v',''; $tag = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/master') {
            $version = "2.0.$($env:GITHUB_RUN_NUMBER)"; $tag = "agent-v$version"
          } else {
            $version = "0.0.0-dev"; $tag = ""
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "Version $version, release tag '$tag'"
      - name: Install what the agent and the build need
        run: python -m pip install --upgrade pip pyinstaller customtkinter pystray pillow cryptography keyring pywebview pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Build the exe
        run: python installer/build_exe.py
      - name: Sign the exe (Authenticode; only for a release, only when the certificate secrets exist)
        if: env.RELEASE_TAG != '' && env.CODESIGN_PFX_BASE64 != '' && env.CODESIGN_PFX_PASSWORD != ''
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe was not found on this runner." }
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:CODESIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 dist\SnehDistribuorsSync.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)." }
            & $signtool.FullName verify /pa /v dist\SnehDistribuorsSync.exe
            if ($LASTEXITCODE -ne 0) { throw "The signature did not verify ($LASTEXITCODE)." }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Report whether the exe is signed
        run: |
          $sig = Get-AuthenticodeSignature dist\SnehDistribuorsSync.exe
          "Authenticode status: $($sig.Status) $($sig.SignerCertificate.Subject)"
      - name: Build the installer (Inno Setup, per-user, no admin)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$($env:VERSION)" "/DSourceExe=..\dist\SnehDistribuorsSync.exe" installer\MyTallyBridge.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)." }
          Get-ChildItem dist\MyTallyBridge-Setup-*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
      - name: Sign the installer (same conditions as the exe)
        if: env.RELEASE_TAG != '' && env.CODESIGN_PFX_BASE64 != '' && env.CODESIGN_PFX_PASSWORD != ''
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign-setup.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            Get-ChildItem dist\MyTallyBridge-Setup-*.exe | ForEach-Object {
              & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:CODESIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)." }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Check no Python source is inside the exe
        run: |
          $listing = python -m PyInstaller.utils.cliutils.archive_viewer -l -r dist\SnehDistribuorsSync.exe
          $listing | Out-File archive-listing.txt
          # --collect-all customtkinter legitimately carries its own files; the agent's modules must not appear
          $own = 'security|config|agent|tally_client|cloud_client|backups|bridge_core|webview_app|gui_app'
          $src = $listing | Select-String -Pattern "'($own)\.py'"
          if ($src) { $src | ForEach-Object { Write-Host $_ }; throw "Agent source (.py) is inside the exe." }
      - name: Check the exe opens and stays open
        run: |
          $exe = Resolve-Path dist\SnehDistribuorsSync.exe
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) { throw "The exe closed by itself (exit code $($app.ExitCode))." }
          Get-Process | Where-Object { $_.MainWindowTitle -eq "MyTally Bridge" } | Select-Object ProcessName, MainWindowTitle
          Get-Process -Name SnehDistribuorsSync -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Build with Nuitka (manual comparison only; never released)
        if: github.event_name == 'workflow_dispatch' && inputs.builder == 'nuitka'
        run: |
          python -m pip install nuitka ordered-set zstandard
          python -m nuitka --onefile --assume-yes-for-downloads --windows-console-mode=disable `
            --windows-icon-from-ico=assets\icon.ico --output-dir=dist-nuitka --output-filename=SnehDistribuorsSync-nuitka.exe `
            --include-data-dir=assets=assets --include-data-dir=ui=ui --include-package=customtkinter --include-package=keyring `
            --include-module=webview gui_app.py
          "{0:N1} MB" -f ((Get-Item dist-nuitka\SnehDistribuorsSync-nuitka.exe).Length / 1MB)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.builder == 'nuitka'
        with:
          name: SnehDistribuorsSync-nuitka-exe-comparison
          path: desktop-sync-agent/dist-nuitka/SnehDistribuorsSync-nuitka.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SnehDistribuorsSync-exe
          path: desktop-sync-agent/dist/SnehDistribuorsSync.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MyTallyBridge-Setup
          path: desktop-sync-agent/dist/MyTallyBridge-Setup-*.exe
          if-no-files-found: error
      - name: Publish a GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A permanent name for the setup file, so releases/latest/download/MyTallyBridge-Setup.exe always works
          Copy-Item (Get-ChildItem dist\MyTallyBridge-Setup-*.exe | Select-Object -First 1).FullName dist\MyTallyBridge-Setup.exe
          gh release create $env:RELEASE_TAG dist\SnehDistribuorsSync.exe dist\MyTallyBridge-Setup.exe `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --latest `
            --title "MyTally Bridge $($env:VERSION)" --generate-notes
