<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Everything this page runs or shows ships with the app: nothing is loaded from, or sent to, the network.
     'unsafe-eval' is there for pywebview, which hands Python's answers back to the page through eval(). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTally Bridge</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<script src="app.js"></script>
</body>
</html>
