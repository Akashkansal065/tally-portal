<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MyTally — Sneh Distributors</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-y: auto;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 24px;
    }
    .card {
      display: none;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus {
      border-color: #10b981;
    }
    button {
      width: 100%;
      background: #10b981;
      color: #0f172a;
      border: none;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:active {
      background: #059669;
    }
    .status-msg {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #f87171;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="spinner" id="loader"></div>
  <div class="title">MyTally</div>
  <div class="subtitle" id="subtext">Connecting to Sneh Distributors...</div>

  <div class="card" id="configCard">
    <div class="card-title">Connect to MyTally Server</div>
    <div class="card-desc">Enter your organization's MyTally portal URL or local server address to begin.</div>
    <input type="url" id="serverInput" placeholder="https://tally-portal-one.vercel.app" />
    <button id="connectBtn" onclick="handleConnect()">Connect & Save</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <script>
    const STORAGE_KEY = 'mytally_server_url';
    const subtext = document.getElementById('subtext');
    const loader = document.getElementById('loader');
    const configCard = document.getElementById('configCard');
    const serverInput = document.getElementById('serverInput');
    const statusMsg = document.getElementById('statusMsg');

    function showConfigUI(message) {
      loader.style.display = 'none';
      subtext.textContent = message || 'Portal URL configuration needed';
      configCard.style.display = 'block';
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) serverInput.value = saved;
    }

    function handleConnect() {
      let url = serverInput.value.trim();
      if (!url) {
        statusMsg.textContent = 'Please enter a valid URL';
        statusMsg.style.display = 'block';
        return;
      }
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      localStorage.setItem(STORAGE_KEY, url);
      statusMsg.style.display = 'none';
      subtext.textContent = 'Redirecting to ' + url + '...';
      configCard.style.display = 'none';
      loader.style.display = 'block';
      window.location.href = url;
    }

    // Auto-connect check
    const DEFAULT_PORTAL_URL = 'https://tally-portal-one.vercel.app';
    const savedUrl = localStorage.getItem(STORAGE_KEY);
    const targetUrl = savedUrl || DEFAULT_PORTAL_URL;

    subtext.textContent = 'Connecting to ' + targetUrl + '...';
    setTimeout(() => {
      window.location.href = targetUrl;
    }, 400);

    // If still here after 6 seconds, network or server might be unreachable
    setTimeout(() => {
      showConfigUI('Unable to reach ' + targetUrl + '. Check internet or update URL:');
    }, 6000);
  </script>
</body>
</html>
