[pytest]
testpaths = tests
# Library deprecation noise (slowapi, pydantic class Config) isn't actionable here
filterwarnings =
    ignore::DeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    # A session that holds a row the database no longer has (see update_stock_item) is a bug, not noise
    error::sqlalchemy.exc.SAWarning
